        border-right-color: #38bdf8;

      }
      .splash-ring-inner {
        position: absolute;

        border-left-color: #f472b6;

      @keyframes splash-orbit {

        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }
      .splash-eyebrow-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #34d399;
        box-shadow: 0 0 8px #34d399;
        animation: splash-pulse 1.5s ease-in-out infinite alternate;
      }
      @keyframes splash-pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
      .splash-progress-track {
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);

      .splash-progress-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #6366f1, #10b981, #38bdf8);

        animation: splash-laser-sweep 1.6s ease-in-out infinite;

      @keyframes splash-laser-sweep {

        50% { transform: translateX(100%); width: 55%; }
