<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GS Suite" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>GS Softwares | 100% Private In-Browser File & Photo Studio</title>
    <meta name="description" content="Edit photos, convert formats, trim audio, and manage PDFs directly on your device. 100% private, instant speed, no watermarks, and works offline." />
    <script type="text/javascript">
      // Decode GitHub Pages SPA 404 redirect query string back to history path
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <style>
      :root {
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      body {
        font-family: var(--font-sans);
      }
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.3s ease, visibility 0.3s;
      }
      #pwa-splash.loaded {
        opacity: 0;
        visibility: hidden;
      }
      .splash-favicon {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        object-fit: cover;
        box-shadow: 0 0 50px rgba(99, 102, 241, 0.45), 0 20px 40px rgba(0, 0, 0, 0.8);
        animation: favicon-splash-sequence 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      @keyframes favicon-splash-sequence {
        /* Stage 1: Pop in */
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        25% {
          transform: scale(1.08);
          opacity: 1;
        }
        /* Stage 2: Slight zoom in */
        50% {
          transform: scale(1.18);
          opacity: 1;
        }
        /* Stage 3: Normal size */
        72% {
          transform: scale(1.0);
          opacity: 1;
        }
        /* Stage 4: Zoom out & fade out */
        100% {
          transform: scale(0.45);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="antialiased min-h-screen">
    <div id="pwa-splash" aria-hidden="true">
      <img src="./favicon.png" alt="GS Softwares" class="splash-favicon" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
